schema: '2.0'
stages:
  featurize:
    cmd: python -m src.features
    deps:
    - path: data/raw/hour.csv
      hash: md5
      md5: d50bd5a6f55131e72a7bedc334e2fce1
      size: 1156736
    - path: src/config.py
      hash: md5
      md5: 70229f0ca774a3710b12676a8bb2d904
      size: 2629
    - path: src/data.py
      hash: md5
      md5: 0ff82c9cc46ac63179090a35ea8cc5ee
      size: 3898
    - path: src/features.py
      hash: md5
      md5: 9b23739ac4190740fcdedccebbfc198e
      size: 4206
    params:
      params.yaml:
        features.categorical_features:
        - season
        - weathersit
        - weekday
        - mnth
        - hr
        features.feature_cols:
        - hr
        - weekday
        - mnth
        - season
        - holiday
        - workingday
        - weathersit
        - temp
        - hum
        - windspeed
        - days_since_start
        - cnt_lag_24h
        - cnt_avg_prev_24h
        - cnt_avg_prev_7d
        - cnt_trail_avg_hr_wd_8w
        - is_rush_hour
        features.rush_hour:
          morning:
          - 7
          - 9
          evening:
          - 17
          - 19
        features.trail_avg_window_weeks: 8
        split.folds:
        - - '2012-05-01'
          - '2012-05-01'
          - '2012-06-30'
        - - '2012-07-01'
          - '2012-07-01'
          - '2012-08-31'
        - - '2012-09-01'
          - '2012-09-01'
          - '2012-10-31'
        split.test_end: '2012-12-31'
        split.test_start: '2012-11-01'
    outs:
    - path: data/processed/features.parquet
      hash: md5
      md5: b68628c791adebfb6af13bf91e2fffc4
      size: 669867
